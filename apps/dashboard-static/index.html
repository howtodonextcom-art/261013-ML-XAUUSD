<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAUUSD Terminal (slice 1)</title>
<style>
:root{--bg:#0b0e13;--panel:#131822;--line:#222b3a;--fg:#d6dde8;--mut:#7d8aa0;--ok:#2ebd85;--warn:#f0b90b;--bad:#f6465d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.px{font:600 22px ui-monospace,Consolas,monospace}.pill{padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;padding:10px}
#chart{min-width:0;overflow:hidden}
@media(max-width:900px){main{grid-template-columns:1fr}#chart{height:38vh!important;min-height:260px}}
#chart{height:68vh;background:var(--panel);border:1px solid var(--line);border-radius:6px}
aside .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
td{padding:1px 8px 1px 0;font-family:ui-monospace,Consolas,monospace}td:first-child{color:var(--mut)}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:3px 9px;border-radius:4px;cursor:pointer}button.on{border-color:var(--ok)}button[aria-pressed=true]{border-color:var(--ok)}button:disabled{opacity:.4;cursor:default}
[data-stale="true"]{opacity:.4;text-decoration:line-through}
.banner{background:#3a1119;color:#ffb3bd;padding:6px 14px;display:none}
.act{font:700 28px ui-monospace,Consolas,monospace;letter-spacing:.04em;margin:2px 0 4px}
.act-BUY{color:var(--ok)}.act-SELL{color:var(--bad)}.act-WAIT{color:var(--mut)}.act-BLOCKED{color:var(--warn)}.act-STALE{color:var(--mut);text-decoration:line-through}
#decision-card.stale{opacity:.5}#decision-card .sub{color:var(--mut);margin:2px 0}#decision-card .why{font-weight:600}
#decision-card ul{margin:2px 0 4px 16px;padding:0}#decision-card .small{font-size:11px;color:var(--mut)}
</style></head><body>
<div id="banner" class="banner" data-testid="state-banner"></div>
<header>
  <b>XAU/USD</b><span class="px" id="bid" data-testid="px-bid">–</span><span class="px" id="ask" data-testid="px-ask" style="color:var(--mut)">–</span>
  <span>spread <b id="spr" data-testid="px-spread">–</b></span><span class="pill" id="conn" data-testid="conn-status">…</span>
  <span id="tfs"></span>
  <span id="draw-bar" data-testid="draw-bar" role="toolbar" aria-label="Drawing tools (your own annotations, not trading signals)">
   <button data-tool="select" data-testid="draw-select" aria-pressed="true" title="Select / drag / pan">Select</button><button data-tool="hline" data-testid="draw-hline" aria-pressed="false" title="Horizontal line">H-line</button><button data-tool="trend" data-testid="draw-trend" aria-pressed="false" title="Trendline (two clicks)">Trend</button><button data-tool="zone" data-testid="draw-zone" aria-pressed="false" title="Price zone (two clicks)">Zone</button>
   <button id="draw-undo" data-testid="draw-undo" disabled title="Undo (Ctrl+Z)">Undo</button><button id="draw-redo" data-testid="draw-redo" disabled title="Redo (Ctrl+Y)">Redo</button><button id="draw-delete" data-testid="draw-delete" disabled title="Delete selected (Del)">Delete</button><button id="draw-clear" data-testid="draw-clear" title="Clear all drawings (can be undone)">Clear</button>
   <span id="draw-count" data-testid="draw-count" style="color:var(--mut)"></span><span id="draw-hint" data-testid="draw-hint" style="color:var(--warn)"></span></span>
  <span style="color:var(--mut)">READ-ONLY · SHADOW · PAPER · chart time = MT5 server time</span>
</header>
<main><div id="chart" data-testid="chart"></div>
<aside>
 <div class="card" id="decision-card" data-testid="decision-card"><h3>Decision · research / paper · computed by the backend</h3>
  <div class="act act-WAIT" id="d-action" data-testid="decision-action">…</div>
  <div class="why" id="d-primary" data-testid="decision-primary">waiting for the first analysis</div>
  <div class="sub" id="d-eligible" data-testid="decision-eligible"></div>
  <div class="sub" id="d-market" data-testid="decision-market"></div>
  <div id="d-setup" data-testid="decision-setup"></div>
  <div id="d-plan" data-testid="decision-plan"></div>
  <div id="d-layers" data-testid="decision-layers"></div>
  <div class="sub" id="d-next" data-testid="decision-next"></div>
  <div class="small" id="d-events" data-testid="decision-events"></div>
  <div class="small" id="d-meta" data-testid="decision-meta"></div>
 </div>
 <div class="card"><h3>Data quality &amp; latency</h3><table id="dq" data-testid="panel-dq"></table></div>
 <div class="card"><h3>Open candle</h3><table id="oc" data-testid="panel-open-candle"></table></div>
 <div class="card"><h3>Source provenance</h3><table id="prov" data-testid="panel-provenance"></table></div>
</aside></main>
<script src="/static/vendor/lwc.js"></script>
<script>
const $=id=>document.getElementById(id); let tf='M1', series, chart, lastTickWall=0, lastFrameWall=0, ws, wsOk=false;
chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#131822'},textColor:'#9aa7bb'},grid:{vertLines:{color:'#1b2230'},horzLines:{color:'#1b2230'}},timeScale:{timeVisible:true,secondsVisible:false},autoSize:true});
series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#2ebd85',downColor:'#f6465d',borderVisible:false,wickUpColor:'#2ebd85',wickDownColor:'#f6465d'});
(()=>{const a=document.getElementById('tv-attr-logo'); if(a){a.setAttribute('rel','noopener noreferrer')}})();
const tfBox=$('tfs'); ['M1','M5','M15','H1','H4'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{tf=t;load(true)};b.id='b'+t;b.dataset.testid='tf-'+t;b.setAttribute('aria-pressed','false');tfBox.appendChild(b)});
const INCOMPLETE=new Set(['PARTIAL_STARTED_MID_BAR','HISTORICAL_QUARANTINED']);
const bar=c=>{const b={time:c.time,open:c.open,high:c.high,low:c.low,close:c.close};if(INCOMPLETE.has(c.completeness)){b.color='#8a8f98';b.wickColor='#8a8f98';b.borderColor='#8a8f98'}return b};
async function load(fit=true){document.querySelectorAll('#tfs button').forEach(b=>{const on=b.id==='b'+tf;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});window.__tf=tf;
  const req=tf; pending=null;
  try{const r=await fetch('/api/candles/'+req+'?limit=2000'); if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json();
    if(req!==tf) return; // a newer timeframe click won the race: never paint stale data under the new label
    const keep=fit?null:chart.timeScale().getVisibleLogicalRange(); const oldN=fit?0:series.data().length;
    series.setData(j.candles.map(bar)); if(fit){chart.timeScale().fitContent()} else if(keep){const dn=j.candles.length-oldN; chart.timeScale().setVisibleLogicalRange({from:keep.from+dn,to:keep.to+dn})} loadErr(null); window.__dataTf=req;}
  catch(e){ if(req!==tf) return; series.setData([]); window.__dataTf=null; loadErr('Could not load '+req+' candles ('+e.message+'). Chart cleared; nothing from another timeframe is shown.'); }}
function loadErr(m){const b=$('banner');if(m){b.style.display='block';b.textContent=m;b.dataset.kind='load-error';}else if(b.dataset.kind==='load-error'){b.dataset.kind='';b.style.display='none'}}
let pending=null; // render throttled to animation frames; every tick still updates data, only paint is coalesced
window.__paintErrors=0;
function paint(){ try{ if(pending && pending.tf===tf && window.__dataTf===tf){series.update(pending.bar)} pending=null }catch(e){window.__paintErrors++;pending=null;loadErr('Chart update error ('+e.message+'); reloading data.');load(true)} requestAnimationFrame(paint)} requestAnimationFrame(paint);
function connect(){ ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{wsOk=true;lastSeq=-1}; ws.onclose=()=>{wsOk=false;setConn('DISCONNECTED');if(lastIntel)staleView();setTimeout(connect,1000)};
 ws.onmessage=e=>{lastFrameWall=performance.now();const m=JSON.parse(e.data);
  if(m.type==='tick'){lastTickWall=performance.now();const t=m.tick;$('bid').textContent=t.bid.toFixed(2);$('ask').textContent=t.ask.toFixed(2);$('spr').textContent=t.spread.toFixed(2);
    for(const c of m.candles){ if(c.tf===tf && window.__dataTf===tf){pending={tf:c.tf,bar:bar(c)}} if(c.tf==='M1'){$('oc').innerHTML=rows({time:new Date(c.time*1000).toISOString().slice(11,19),O:c.open,H:c.high,L:c.low,C:c.close,ticks:c.tick_volume,complete:c.completeness,state:c.state})}}}
  else if(m.type==='intel'){renderIntel(m)}
  else if(m.type==='health'){health(m)}}}
function setConn(s){const el=$('conn');['bid','ask','spr'].forEach(i=>{const e=$(i);e.dataset.stale=(s==='CONNECTED_ACTIVE')?'false':'true';e.title=(s==='CONNECTED_ACTIVE')?'':'Last known value, not live ('+s+')'});el.textContent=s;el.style.background=s==='CONNECTED_ACTIVE'?'var(--ok)':(s==='CONNECTED_IDLE'||s==='STALE'||s==='RECOVERING'||s==='CONNECTING'||s==='DEGRADED')?'var(--warn)':'var(--bad)';el.style.color='#000';
 const b=$('banner'); if(b.dataset.kind==='load-error') return; b.style.display=(s==='CONNECTED_ACTIVE')?'none':'block'; b.textContent='Data state: '+s+(s==='CONNECTED_IDLE'?' — terminal connected, no recent ticks.':s==='DEGRADED'?' — terminal connected but the gateway pipeline/persistence is faulty; see Data quality panel.':s==='TRANSPORT_STALLED'?' — no frames from the gateway for >4 s; prices are not live.':' — prices shown may be old; no real-time claim.');}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rows=o=>Object.entries(o).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
function health(h){setConn(wsOk?h.connection:'DISCONNECTED');if(h.last_tick&&$('bid').textContent==='–'){const k=h.last_tick;$('bid').textContent=k.bid.toFixed(2);$('ask').textContent=k.ask.toFixed(2);$('spr').textContent=k.spread.toFixed(2)}const L=h.gateway_latency_ms||{};
 $('dq').innerHTML=rows({'tick rate':h.tick_rate_hz.toFixed(1)+' Hz','data age':h.data_age_s==null?'n/a':h.data_age_s.toFixed(2)+' s','queue':h.queue_depth,'ticks':h.ticks_total,
  'gaps':(h.detail.gaps||[]).length,'queue drops':h.detail.dropped,'persist drops':h.persistence?h.persistence.dropped:'n/a','persist hole':h.persistence?h.persistence.hole:'n/a','pipeline errors':h.pipeline?h.pipeline.errors:'n/a','degraded':(h.degraded_reasons||[]).join('; ')||'no','flags':JSON.stringify(h.quality_counts),'gw p50/p95/p99 ms':L.n?[L.p50,L.p95,L.p99].map(x=>x.toFixed(2)).join(' / '):'n/a','max ms':L.n?L.max.toFixed(2):'n/a'});
 const d=h.detail; $('prov').innerHTML=rows({source:'mt5_py_poll (Mode A)',server:d.server,symbol:d.symbol,build:d.build,demo:d.account_is_demo,'server UTC off':d.server_utc_offset_s+' s ('+d.server_utc_offset_confidence+', n='+d.server_utc_offset_samples+')',basis:h.price_basis,error:d.error||'–'});}
// ---- Decision panel: the BACKEND decides (BUY/SELL/WAIT/BLOCKED); this code only displays the record and draws its levels
let lastIntelWall=0, shownLines=[], lastIntel=null, lastSeq=-1;
const tm=v=>v==null?'–':new Date(v*1000).toISOString().slice(11,16);
const f2=v=>(v==null||isNaN(v))?'–':Number(v).toFixed(2);
const li=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="small"> none</span>';
function clearLines(){shownLines.forEach(l=>{try{series.removePriceLine(l.ref)}catch(e){}});shownLines=[]}
function drawLines(o,notEligible){clearLines(); if(!o) return;
 const add=(price,title,color,style)=>{if(price==null)return; shownLines.push({price,title,ref:series.createPriceLine({price,color,lineWidth:1,lineStyle:style,axisLabelVisible:true,title})})};
 if(o.zone){add(o.zone.high,'ZONE hi','#8a8f98',2);add(o.zone.low,'ZONE lo','#8a8f98',2)}
 (o.lines||[]).forEach(x=>notEligible?add(x.price,'NOT ELIGIBLE · '+x.kind,'#8a8f98',2):add(x.price,x.kind,x.kind==='SL'?'#f6465d':x.kind==='TP'?'#2ebd85':'#4aa3ff',0))}
function renderIntel(p){
 if(!p||p.status==='NOT_READY'||!p.decision){$('d-primary').textContent='analysis not ready'+(p&&p.error?' ('+p.error+')':'');return}
 if(p.seq!=null){ if(p.seq<lastSeq) return; lastSeq=p.seq }                        // frames can arrive out of order: never let an older decision overwrite a newer one
 lastIntel=p; lastIntelWall=performance.now()-(p.intel_age_s||0)*1000; const d=p.decision, a=$('d-action');   // a cached payload keeps its real age
 a.textContent=d.action; a.className='act act-'+d.action; $('decision-card').classList.remove('stale'); window.__intel=p;
 if((p.intel_age_s||0)>10){staleView(); return}
 if(d.primary_reason==='DATA_STALE'){                                                    // the backend itself says the data is stale: STALE badge, the reasons stay visible, no levels exist
  a.textContent='STALE'; a.className='act act-STALE'; $('decision-card').classList.add('stale'); clearLines();
  $('d-primary').textContent='DATA_STALE  ['+d.layer+' reason]: no decision is made on stale data';
  ['d-eligible','d-market','d-setup','d-plan','d-next','d-events'].forEach(i=>{$(i).textContent=''}); const r0=d.reasons||{};
  $('d-layers').innerHTML='<div class="small">market: '+esc((r0.market||[]).join(', ')||'–')+' · strategy: '+esc((r0.strategy||[]).join(', ')||'–')+' · gate: '+esc((r0.gate||[]).join(', ')||'–')+'</div>'; return}
 $('d-primary').textContent=d.primary_reason+'  ['+d.layer+' reason]';
 $('d-eligible').textContent='Strategy eligible: '+(d.strategy_eligible?'YES':'no')+(d.action==='BLOCKED'?' · BLOCKED by gate/risk: NOT ELIGIBLE, the levels below are hypothetical':'');
 const m=p.market||{}, rg=m.regime||{};
 $('d-market').textContent=(m.direction_tf||'H1')+' direction: '+(m.direction||'?')+' · '+(m.conflict_tf||'H4')+': '+(m.conflict_direction||'?')+(m.conflict?' (CONFLICT)':'')+' · regime '+Object.entries(rg).map(([k,v])=>k+':'+v).join(' ');
 const s=d.setup;
 $('d-setup').innerHTML=s?('<div><b>Setup</b> '+esc(s.direction)+' · '+esc(s.state)+' · '+esc(s.setup_id)+'</div>'+li(s.evidence)+'<div class="small">invalidation '+f2(s.invalidation_level)+' · planned entry '+f2(s.entry_level)+'</div><div class="small" data-testid="decision-expiry">expires ~'+tm(s.expires_at)+' (server time; bar-count rule, later across market breaks)'+(s.entry_window_ends_at?' · entry window closes ~'+tm(s.entry_window_ends_at):'')+'</div>'):'<div class="sub">No active setup</div>';
 const q=d.plan;
 const hyp=d.action==='BLOCKED'; $('d-plan').innerHTML=q?(hyp?'<div class="small" data-testid="decision-plan-label"><b>NOT ELIGIBLE · HYPOTHETICAL LEVELS ONLY</b> (no size is shown)</div>':'<div class="small" data-testid="decision-plan-label">paper plan · hypothetical · no order is sent</div>')+('<div><b>Plan</b> entry '+f2(q.entry)+' · SL '+f2(q.stop_loss)+' · TP '+f2(q.take_profit)+' <span class="small">(TP2 reference '+f2(q.tp2_reference)+', not an exit rule)</span></div><div>'+(hyp?'':'lot '+f2(q.lot)+' · ')+'net R:R '+f2(q.net_rr)+' (gross '+f2(q.gross_rr)+')'+(hyp?'':' · risk '+(q.risk_fraction*100).toFixed(2)+'% of equity')+'</div>'):'<div class="sub">No trade plan</div>';
 const r=d.reasons||{}; $('d-layers').innerHTML='<div class="small">market: '+esc((r.market||[]).join(', ')||'–')+' · strategy: '+esc((r.strategy||[]).join(', ')||'–')+' · gate: '+esc((r.gate||[]).join(', ')||'–')+'</div>';
 const ev=(p.setup_events||[]).slice(-4).reverse(); const TERM=['INVALIDATED','MISSED','EXPIRED'];
 $('d-events').innerHTML=ev.length?'<b>Recent setup events</b>'+ev.map(e=>'<div'+(TERM.includes(e.state)?' style="color:var(--warn)"':'')+'>'+tm(e.known_at)+' · '+esc(e.direction)+' · '+esc(e.state)+' ('+esc((e.reasons||[]).join(', '))+') · '+esc(e.setup_id)+'</div>').join(''):'';
 $('d-next').textContent=d.next_required?'Next required: '+d.next_required:'';
 $('d-meta').textContent=d.strategy_version+' · dataset '+d.dataset_version+' · evaluated '+new Date((p.evaluated_at||0)*1000).toISOString().slice(11,19)+' (server time) · EXECUTION NOT AUTHORIZED: research decision only';
 drawLines(p.overlays,d.action==='BLOCKED')}
function staleView(){const a=$('d-action'); a.textContent='STALE'; a.className='act act-STALE'; $('decision-card').classList.add('stale');   // the old BUY/SELL text must not stay on screen
 $('d-primary').textContent='DECISION NOT REFRESHED'+(lastIntelWall?' for '+Math.round((performance.now()-lastIntelWall)/1000)+' s':'')+': do not rely on it';
 ['d-eligible','d-market','d-setup','d-plan','d-layers','d-next','d-events'].forEach(i=>{$(i).textContent=''}); clearLines()}   // nothing from the old decision stays on screen
setInterval(()=>{ if(lastIntelWall && performance.now()-lastIntelWall>10000) staleView() },1000);
fetch('/api/intel').then(r=>r.json()).then(renderIntel).catch(()=>{});
// transport watchdog: the server sends a health frame every second; silence on an OPEN socket is a transport fault, distinct from 'no ticks'
setInterval(()=>{ if(wsOk && lastFrameWall && performance.now()-lastFrameWall>4000) setConn('TRANSPORT_STALLED') },1000);
setInterval(()=>{ if(wsOk && lastTickWall && performance.now()-lastTickWall>60000) setConn('STALE')},1000);
window.__crosshair=null;chart.subscribeCrosshairMove(p=>{window.__crosshair=p&&p.time?{time:p.time,price:series.coordinateToPrice(p.point.y),x:p.point.x,y:p.point.y}:null});
window.__qa={priceAt:y=>series.coordinateToPrice(y),lineY:p=>series.priceToCoordinate(p),lines:()=>shownLines.map(l=>({price:l.price,title:l.title})),intel:()=>lastIntel,tf:()=>tf,dataTf:()=>window.__dataTf,data:()=>series.data(),range:()=>chart.timeScale().getVisibleLogicalRange(),crosshair:()=>window.__crosshair,refresh:()=>load(false),setRange:r=>chart.timeScale().setVisibleLogicalRange(r),injectBadUpdate:()=>{const d=series.data();pending={tf:tf,bar:{time:d[0].time,open:1,high:1,low:1,close:1}}}};  // QA hook: an update older than the newest bar makes the library throw
load().then(connect); setInterval(()=>{ if(!pending) load(false) }, 60000);
</script>
<script src="/static/drawings.js"></script></body></html>
